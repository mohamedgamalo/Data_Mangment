function toast(m,type,ms){

  const box=$('#toasts');while(box.children.length>=4)box.firstChild.remove();
  const el=document.createElement('div');el.className='tt '+type;el.setAttribute('role',type==='err'?'alert':'status');el.style.setProperty('--d',ms+'ms');
  el.innerHTML='<i>'+({ok:'✓',err:'!',warn:'!',info:'i'}[type])+'</i><div><b></b><span></span></div><button aria-label="'+tx('إغلاق','Close')+'">×</button><em></em>';
  el.querySelector('b').textContent=TT[S.lang][type];el.querySelector('span').textContent=m;
  const kill=()=>{el.classList.add('out');setTimeout(()=>el.remove(),200)};
  el.querySelector('button').onclick=kill;el.querySelector('em').addEventListener('animationend',kill);
  box.appendChild(el);

document.addEventListener('click',e=>{
  if(e.target.id==='ov'){closeModal();return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,r=id?store.find(id):null;
  if(a==='add')openPanel();
  else if(a==='close')closeModal();
  else if(a==='edit'){if(r&&!isLocked(r))openPanel(id)}
  else if(a==='save_old'){
    const md=b.closest('.fp'),v={};
    md.querySelectorAll('[data-f]').forEach(i=>v[i.dataset.f]=i.type==='checkbox'?i.checked:i.value.trim());
    const port=Number(v.port),bad=['schema','tenant','table','col'].filter(k=>!v[k]);
    if(!(Number.isInteger(port)&&port>=1&&port<=65535))bad.push('port');
    md.querySelectorAll('[data-f]').forEach(i=>i.classList.toggle('bad',bad.includes(i.dataset.f)));
    md.querySelectorAll('.fe').forEach(x=>x.remove());
    if(bad.length){bad.forEach(k=>{md.querySelector('[data-f="'+k+'"]').insertAdjacentHTML('afterend','<div class="fe">'+(k==='port'?tx('البورت بين 1 و 65535','Port must be between 1 and 65535'):tx('هذا الحقل مطلوب','This field is required'))+'</div>')});md.querySelector('[data-f="'+bad[0]+'"]').focus();toast(t('req'),'err');return}
    const eid=S.panel&&S.panel.id,cur=eid?store.find(eid):null;
    if(cur&&isLocked(cur))return;
    if(cur)Object.assign(cur,v,{port:port,ts:Date.now(),status:'saved'});
    else{const nr=Object.assign({id:'r'+Date.now(),user:S.user.name,ts:Date.now(),status:'saved'},v,{port:port});S.rows.unshift(nr);S.panel.id=nr.id}
    S.panel.dirty=false;store.persist();rerender();toast(t('tSaved'));
  }
  else if(a==='del'){
    if(r&&!isLocked(r))confirmDel(r);
  }
  else if(a==='delok'){
    if(r&&!isLocked(r)){sb.from('changes').delete().eq('id',id).then(({error})=>{if(error)throw error;return loadRows()}).then(()=>{if(S.panel&&S.panel.id===id)S.panel=null;closeModal();rerender();toast(t('tDel'))}).catch(fail)}
  }
  else if(a==='send'){if(r&&r.status==='saved')run(b,async()=>{const{error}=await sb.from('changes').update({status:'sent'}).eq('id',id);if(error)throw error;await loadRows();if(S.panel&&S.panel.id===id)S.panel=null;rerender();toast(tx('تم نشر '+r.schema+'.'+r.table+' إلى مطور الخرائط','Published '+r.schema+'.'+r.table+' to the Map Developer'),'ok')})}
  else if(a==='done'){if(r&&r.status==='sent')run(b,async()=>{const{error}=await sb.from('changes').update({status:'done'}).eq('id',id);if(error)throw error;await loadRows();rerender();toast(tx('تم تسجيل استلام '+r.schema+'.'+r.table,'Receipt recorded for '+r.schema+'.'+r.table),'ok')})}
});

const typeStr=d=>(d.type||'')+(PH[d.type]&&d.param?'('+d.param+')':'');
const qi=s=>'"'+String(s).replace(/"/g,'""')+'"';
function sqlOf(d){
  if(!d.schema||!d.table)return '';
  const tb=qi(d.schema)+'.'+qi(d.table);
  if(d.action==='drop')return d.col?'ALTER TABLE '+tb+' DROP COLUMN '+qi(d.col)+';':'';
  if(!d.col||!d.type)return '';
  if(d.action==='add')return 'ALTER TABLE '+tb+' ADD COLUMN '+qi(d.col)+' '+typeStr(d)+(d.nul?'':' NOT NULL')+(d.def?' DEFAULT '+d.def:'')+';';
  return 'ALTER TABLE '+tb+' ALTER COLUMN '+qi(d.col)+' TYPE '+typeStr(d)+';';
}

function panelHtml(){
  if(!S.panel)return '';
  const P=S.panel,d=P.d,r=P.id?store.find(P.id):null,T=CAT[d.tenant],SC=T&&T.schemas[d.schema],TB=SC&&SC[d.table],A=d.action;
  const sel=(k,l,arr,off)=>'<div><label>'+t(l)+'</label><select data-f="'+k+'"'+(off?' disabled':'')+'><option value="">'+t('pick')+'</option>'+arr.map(v=>'<option'+(v===d[k]?' selected':'')+'>'+esc(v)+'</option>').join('')+'</select></div>';
  const inp=(k,l,ph)=>'<div><label>'+t(l)+'</label><input data-f="'+k+'" value="'+esc(d[k])+'" placeholder="'+esc(ph||'')+'"></div>';
  const old=TB&&d.col?TB[d.col]||'':'';
  let h='<div class="fp" id="fp"><h2>'+t(r?'editRow':'newRow')+'</h2><div class="meta">'+esc(r?r.user:S.user.name)+' · '+fmt(r?r.ts:Date.now())+'</div>';
  h+='<div class="seg">'+['add','alter','drop'].map(k=>'<button type="button" class="sg '+k+(A===k?' on':'')+'" data-a="kind" data-k="'+k+'">'+t('k_'+k)+'</button>').join('')+'</div><div class="fg">';
  h+=sel('tenant','tenant',Object.keys(CAT))+sel('schema','schema',T?Object.keys(T.schemas):[],!T)+sel('table','table',SC?Object.keys(SC):[],!SC);
  h+='<div><label>'+t('port')+'</label><input value="'+(T?T.port:'')+'" readonly></div>';
  h+=A==='add'?inp('col','newName','user_status'):sel('col','col',TB?Object.keys(TB):[],!TB);
  if(A!=='add')h+='<div><label>'+t('oldType')+'</label><input value="'+esc(old)+'" readonly></div>';
  if(A!=='drop'){h+='<div><label>'+t('newType')+'</label><select data-f="type">'+TYPES.map(v=>'<option'+(v===d.type?' selected':'')+'>'+v+'</option>').join('')+'</select></div>';if(PH[d.type])h+=inp('param','param',PH[d.type])}
  if(A==='add')h+=inp('def','def','')+'<div><label class="c"><input type="checkbox" data-f="nul" '+(d.nul?'checked':'')+'> '+t('nul')+'</label></div>';
  h+=inp('layer','layer','roads_layer')+'<div><label class="c"><input type="checkbox" data-f="cache" '+(d.cache?'checked':'')+'> '+t('cacheOn')+'</label></div>';
  h+='<div class="full"><label>'+t('notes')+'</label><textarea data-f="notes">'+esc(d.notes)+'</textarea></div>';
  if(A!=='add')h+='<div class="full warn">'+IC.warn+t('breakMsg')+'</div>';
  h+='<div class="full"><label>'+t('sql')+'</label><pre class="sql" id="sql">'+esc(sqlOf(d))+'</pre></div></div>';
  const can=!!r&&r.status==='saved'&&!P.dirty;
  return h+'<div class="mb"><button class="btn s" data-a="pclose">'+t('close')+'</button><button class="btn s e" data-a="save">'+t('save')+'</button><button class="btn p s" id="pubp" data-a="send" data-id="'+(r?r.id:'')+'"'+(can?'':' disabled')+'>'+IC.send+t('send')+'</button></div></div>';
}
function saveTask(){
  readPanel();const P=S.panel,d=P.d,T=CAT[d.tenant],TB=T&&T.schemas[d.schema]&&T.schemas[d.schema][d.table],bad=[],m=[];
  ['tenant','schema','table','col'].forEach(k=>{if(!d[k])bad.push(k)});
  if(d.action==='add'&&d.col){
    if(!/^[a-z_][a-z0-9_]*$/i.test(d.col)){bad.push('col');m.push(tx('اسم العمود: حروف وأرقام و_ فقط ولا يبدأ برقم','Column name: letters, digits and _ only, not starting with a digit'))}
    else if(TB&&TB[d.col]){bad.push('col');m.push(tx('العمود موجود بالفعل في هذا الجدول','This column already exists in the table'))}
  }
  if(d.action==='alter'&&TB&&TB[d.col]&&TB[d.col]===typeStr(d)){bad.push('type');m.push(tx('النوع الجديد مطابق للنوع الحالي','The new type is the same as the current one'))}
  $('#fp').querySelectorAll('[data-f]').forEach(i=>i.classList.toggle('bad',bad.includes(i.dataset.f)));
  if(bad.length){toast(m[0]||t('req'),'err');return}
  const row=Object.assign({},d,{oldType:d.action==='add'?'':(TB&&TB[d.col])||'',port:T.port,ts:Date.now(),status:'saved'});
  const cur=P.id&&store.find(P.id);
  (async()=>{
    if(cur){const{error}=await sb.from('changes').update(toDb(row)).eq('id',cur.id);if(error)throw error}
    else{const{data,error}=await sb.from('changes').insert(Object.assign(toDb(row),{username:S.user.name})).select('id').single();if(error)throw error;P.id=data.id}
    await loadRows();P.dirty=false;rerender();toast(t('tSaved'));
  })().catch(fail);
}
function visible(){let rs=S.user.role==='map'?S.rows.filter(isLocked):S.rows;const q=S.q.trim().toLowerCase();if(q)rs=rs.filter(r=>[r.user,r.tenant,r.schema,r.table,r.col,r.type,r.oldType,r.layer,r.port,r.notes,r.action?t('k_'+r.action):'',fmt(r.ts)].join(' ').toLowerCase().includes(q));return rs}
function typeOf(r){const n=typeStr(r);return r.action==='drop'?(r.oldType||''):r.action==='alter'?((r.oldType||'?')+' → '+n):r.action==='add'?n:''}
function tableHtml(){
  const rs=visible();
  if(!rs.length)return '<div class="empty">'+(S.q.trim()?t('noRes'):t(S.user.role==='db'?'emptyDb':'emptyMap'))+'</div>';
  const H=['tenant','schema','table','task','col','type','port','layer','cache','notes','by','act'];
  const c=(k,v,x)=>'<td data-l="'+esc(t(k))+'"'+(x?' class="'+x+'"':'')+'>'+v+'</td>';
  const body=rs.slice(0,S.lim).map(r=>{const a=r.action;return '<tr>'+c('tenant',esc(r.tenant),'k')+c('schema',esc(r.schema),'k')+c('table',esc(r.table),'k')
    +c('task',a?'<span class="badge k-'+a+'">'+t('k_'+a)+'</span>'+(a!=='add'?'<span class="brk">'+t('breaking')+'</span>':''):'—')
    +c('col',esc(r.col),'k')+c('type',esc(typeOf(r)),'k')+c('port',esc(r.port))+c('layer',esc(r.layer||'—'))+c('cache',t(r.cache?'yes':'no'))+c('notes',esc(r.notes),'n')
    +c('by',esc(r.user)+'<small>'+fmt(r.ts)+'</small>')+c('act',actions(r),'act')+'</tr>'}).join('');
  return '<table><thead><tr>'+H.map(k=>'<th>'+t(k)+'</th>').join('')+'</tr></thead><tbody>'+body+'</tbody></table>';
}
document.addEventListener('input',e=>{if(S.panel&&e.target.closest&&e.target.closest('.fp')){readPanel();const s=$('#sql');if(s)s.textContent=sqlOf(S.panel.d)}});
document.addEventListener('change',e=>{
  const f=e.target.tagName==='SELECT'&&e.target.dataset.f;if(!S.panel||!f)return;
  readPanel();const d=S.panel.d,rs={tenant:['schema','table','col'],schema:['table','col'],table:['col']}[f];
  if(rs)rs.forEach(k=>d[k]='');
  if(f==='type')d.param=PH[d.type]||'';
  S.panel.dirty=true;paintPanel();
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||!S.panel)return;
  if(b.dataset.a==='save')saveTask();
  else if(b.dataset.a==='kind'){readPanel();S.panel.d.action=b.dataset.k;S.panel.d.col='';S.panel.dirty=true;paintPanel()}
});
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.user){S.user=null;S.rows=[];go()}});
setInterval(()=>{if(!S.user||S.panel||$('#ov')||document.hidden)return;loadRows().then(()=>{const w=$('#tw');if(w){const y=w.scrollTop;w.innerHTML=tableHtml();w.scrollTop=y;$('#ft').innerHTML=footHtml()}}).catch(()=>{})},15000);
boot();
</script>
</body>
</html>
